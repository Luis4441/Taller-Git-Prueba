<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Itinerario y Mapa de Colombia</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
		<style>
			html, body { height: 100%; }
			#mapDiv { width: 100%; height: 80vh; min-height: 400px; }
		</style>
	</head>
	<body>
		<div class="container-fluid">
			<div class="row vh-100">
				<div class="col-md-4 border-end p-4 bg-light">
					<h4 class="mb-3">Crear Itinerario</h4>
					<form id="itineraryForm">
						<div class="mb-3">
							<label for="aeropuertoSalida" class="form-label">Aeropuerto de salida</label>
							<input type="text" class="form-control" id="aeropuertoSalida" placeholder="Ej: El Dorado (BOG)" required>
						</div>
						<div class="mb-3">
							<label for="aeropuertoLlegada" class="form-label">Aeropuerto de llegada</label>
							<input type="text" class="form-control" id="aeropuertoLlegada" placeholder="Ej: José María Córdova (MDE)" required>
						</div>
						<div class="mb-3">
							<label for="intensidadHoraria" class="form-label">Intensidad horaria (horas)</label>
							<input type="number" class="form-control" id="intensidadHoraria" min="1" max="24" value="1" required>
						</div>
						<button type="submit" class="btn btn-primary">Crear itinerario</button>
					</form>

					<div id="itinerarySummary" class="mt-4" style="display:none;">
						<h5>Resumen</h5>
						<ul class="list-group">
							<li class="list-group-item"><strong>Salida:</strong> <span id="sumSalida"></span></li>
							<li class="list-group-item"><strong>Llegada:</strong> <span id="sumLlegada"></span></li>
							<li class="list-group-item"><strong>Intensidad:</strong> <span id="sumIntensidad"></span> horas</li>
						</ul>
					</div>
				</div>

				<div class="col-md-8 p-3">
					<h4 class="mb-3">Mapa de Colombia</h4>
					<div id="mapDiv" class="border"></div>
				</div>
			</div>
		</div>

		<script>
			document.addEventListener('DOMContentLoaded', function () {
				// Render a choropleth that highlights Colombia using ISO-3 code
				var data = [{
					type: 'choropleth',
					locations: ['COL'],
					locationmode: 'ISO-3',
					z: [1],
					colorscale: [[0, '#cfe9f7'], [1, '#2b83ba']],
					showscale: false,
					marker: {line:{color:'rgb(180,180,180)',width:0.5}}
				}];

				var layout = {
					margin: {t:0,b:0,l:0,r:0},
					geo: {
						scope: 'south america',
						projection: {type: 'mercator'},
						showcountries: true,
						countrycolor: 'rgba(0,0,0,0.2)'
					}
				};

				Plotly.newPlot('mapDiv', data, layout, {responsive: true});

				// Form handling: display summary
				var form = document.getElementById('itineraryForm');
				form.addEventListener('submit', function (e) {
					e.preventDefault();
					var salida = document.getElementById('aeropuertoSalida').value.trim();
					var llegada = document.getElementById('aeropuertoLlegada').value.trim();
					var intensidad = document.getElementById('intensidadHoraria').value;

					document.getElementById('sumSalida').textContent = salida;
					document.getElementById('sumLlegada').textContent = llegada;
					document.getElementById('sumIntensidad').textContent = intensidad;
					document.getElementById('itinerarySummary').style.display = 'block';
				});
			});
		</script>
	</body>
</html>
